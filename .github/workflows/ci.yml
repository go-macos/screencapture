name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all -- no red cross, no
  # run, just silence that reads exactly like success. actionlint is the only
  # thing that catches it, so it is the first lane here.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The real ScreenCaptureKit lane. A runner has no display and no Screen
  # Recording grant, so what runs here is the portable logic plus everything
  # that talks to the REAL framework without capturing anyone else's content:
  # the class lookups, the CMTime by-value ABI round trip through a real
  # SCStreamConfiguration, the runtime output class, the permission-free
  # current-process enumeration, and every failure path. The live capture proof
  # is behind -tags=integration and does not run here.
  darwin:
    name: darwin (real ScreenCaptureKit, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: The integration suite must at least COMPILE
        run: CGO_ENABLED=0 go vet -tags integration ./...
      - name: Test
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Race (CGO=1)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE file, not the total. The purego bindings
      # cannot be covered without a display and a TCC grant, and a
      # total-coverage gate would either be a lie or force a permission the
      # runner cannot hold.
      - name: 100% coverage gate on the portable layer
        shell: bash
        run: |
          go tool cover -func=cover.out | grep '/screencapture.go:' > portable.txt
          cat portable.txt
          if grep -v '100.0%' portable.txt; then
            echo "::error::the portable layer is below 100% (lines above)"; exit 1
          fi
          echo "portable layer: 100%"
      - name: Coverage summary (whole package, bindings included)
        run: go tool cover -func=cover.out | tail -1

  # Every non-darwin platform must COMPILE and answer ErrUnsupported rather
  # than failing to build: a consumer cross-compiles this without thinking
  # about it.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six of Go's 64-bit architectures, then the other platforms.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  linux:
    name: linux (stub tests + portable coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: 100% coverage gate on the portable layer
        shell: bash
        run: |
          go tool cover -func=cover.out | grep '/screencapture.go:' > portable.txt
          cat portable.txt
          if grep -v '100.0%' portable.txt; then
            echo "::error::the portable layer is below 100% on linux (lines above)"; exit 1
          fi
      - name: 100% coverage gate on the non-darwin stubs
        shell: bash
        run: |
          go tool cover -func=cover.out | grep '/screencapture_other.go:' > stubs.txt
          cat stubs.txt
          if grep -v '100.0%' stubs.txt; then
            echo "::error::the non-darwin stubs are below 100% (lines above)"; exit 1
          fi

  windows:
    name: windows (stub tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: 0
